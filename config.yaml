project:
  name: hybridbathnet_baseline
  # Update to the UTM zone EPSG code covering your AOI, e.g. EPSG:32643 for
  # Kollam/Kerala coast. Use src.utils.utm_epsg_from_lonlat(lon, lat) to find it.
  crs: "EPSG:32643"

aoi:
  # WKT polygon in EPSG:4326 (lon, lat order) — UPDATE to your region of interest
  wkt: "POLYGON((76.30 8.90, 76.55 8.90, 76.55 9.20, 76.30 9.20, 76.30 8.90))"
  bbox: [76.30, 8.90, 76.55, 9.20]  # [minlon, minlat, maxlon, maxlat]

sentinel2:
  collection: "SENTINEL-2"
  product_type: "S2MSI2A"          # L2A, bottom-of-atmosphere reflectance
  start_date: "2024-01-01"
  end_date: "2024-04-30"
  max_cloud_cover: 10               # percent
  bands: ["B02", "B03", "B04", "B08"]   # blue, green, red, NIR
  raw_dir: "data/raw/sentinel2"

gebco:
  # GEBCO has no simple REST API for arbitrary bbox extraction — download
  # manually from https://download.gebco.net/ using the bbox above (NetCDF),
  # save to data/raw/gebco/gebco_subset.nc, then run src/download_gebco.py
  # to reproject/convert it. This path is the CONVERTED GeoTIFF output.
  raw_path: "data/raw/gebco/gebco_subset.tif"

coastline:
  raw_path: "data/raw/coastline/coastline.geojson"

preprocessing:
  processed_dir: "data/processed"

features:
  patch_size: 64
  patch_stride: 32
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  split_axis: "lon"        # spatial split (by column) to avoid leakage
  features_dir: "data/features"

training:
  batch_size: 32
  epochs: 80
  learning_rate: 0.001
  device: "cuda"            # falls back to CPU automatically if unavailable
  checkpoint_dir: "checkpoints"


# Physics-guided & Uncertainty-aware hyper-parameters — v2
hybridbathnet:
  in_channels: 6
  feature_dim: 128
  dropout_rate: 0.1

  # --- v2: Improved QAA Kd ---
  i0_over_epsilon: 100.0   # Signal-to-noise ratio threshold for Beer-Lambert extinction
  use_red_kd: true          # Use red band in QAA Kd formula (improves turbid water accuracy)

  # --- v2: Cross-attention physics fusion ---
  n_attn_heads: 4           # Number of attention heads in CrossAttentionPhysicsFusion
  phys_tokens: 4            # Number of physics embedding tokens (richer physics representation)

  # --- v2: Loss weights ---
  loss_weights:
    w_mse: 1.0              # Weight for direct Depth Regression MSE Loss
    w_nll: 1.0              # Weight for heteroscedastic Gaussian NLL loss (Aleatoric Uncertainty)
    w_phys: 0.5             # Weight for physical non-negativity depth constraint (\hat{y} >= 0)
    w_ext: 0.5              # Weight for Beer-Lambert optical extinction depth limit (\hat{y} <= z_ext)

  # --- v2: Depth-weighted loss ---
  use_depth_weighting: true  # Up-weight deep-water samples (harder; less represented)
  depth_weight_scale: 10.0   # Depth (m) at which sample weight = 1.0

  # --- v2: Curriculum NLL annealing ---
  nll_warmup_epochs: 20      # Linearly ramp NLL weight from 0 -> w_nll over this many epochs
                             # Model first learns MSE then gradually calibrates uncertainty

  # --- v2: Training stability ---
  grad_clip_norm: 1.0        # Max gradient norm (prevents physics loss gradient explosions)
  lr_restart_period: 30      # CosineAnnealingWarmRestarts T_0 (LR restart interval in epochs)

  # --- v2: Spectral augmentation ---
  aug_noise_std: 0.02        # Gaussian noise std for spectral jitter augmentation

  # --- v2: Depth-stratified curriculum sampler ---
  depth_strata: 5            # Number of depth quantile strata for balanced batching

  # --- v2: Uncertainty inference ---
  mc_samples: 30             # Number of MC Dropout forward passes (increased from 20)

evaluation:
  results_dir: "results"

export:
  output_dir: "outputs/rasters"

