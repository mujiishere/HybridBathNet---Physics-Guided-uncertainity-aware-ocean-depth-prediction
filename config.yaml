project:
  name: hybridbathnet_v3
  # Update to the UTM zone EPSG code covering your AOI.
  # Use src.utils.utm_epsg_from_lonlat(lon, lat) to find it.
  crs: "EPSG:32643"

aoi:
  # WKT polygon in EPSG:4326 (lon, lat order) — UPDATE to your region of interest
  wkt: "POLYGON((76.30 8.90, 76.55 8.90, 76.55 9.20, 76.30 9.20, 76.30 8.90))"
  bbox: [76.30, 8.90, 76.55, 9.20]  # [minlon, minlat, maxlon, maxlat]

sentinel2:
  collection: "SENTINEL-2"
  product_type: "S2MSI2A"          # L2A, bottom-of-atmosphere reflectance
  start_date: "2024-01-01"
  end_date: "2024-04-30"
  max_cloud_cover: 10               # percent
  bands: ["B02", "B03", "B04", "B08"]   # blue, green, red, NIR
  raw_dir: "data/raw/sentinel2"

gebco:
  # GEBCO has no simple REST API for arbitrary bbox extraction — download
  # manually from https://download.gebco.net/ using the bbox above (NetCDF),
  # save to data/raw/gebco/gebco_subset.nc, then run src/download_gebco.py
  # to reproject/convert it. This path is the CONVERTED GeoTIFF output.
  raw_path: "data/raw/gebco/gebco_subset.tif"

coastline:
  raw_path: "data/raw/coastline/coastline.geojson"

preprocessing:
  processed_dir: "data/processed"

features:
  patch_size: 64
  patch_stride: 32
  train_frac: 0.70
  val_frac:   0.15
  test_frac:  0.15
  split_axis: "lon"               # spatial split (by column) to avoid leakage
  features_dir: "data/features"
  # §2.5 — optional distance-to-shore channel from downloaded OSM coastline
  use_distance_to_shore: false    # set true to add the channel (requires scipy)

training:
  batch_size: 32
  # §1.4 — epochs must be a multiple of lr_restart_period to avoid mid-cycle cutoff
  epochs: 90                      # 90 = 3 × T_0=30 cycles
  learning_rate: 0.001
  device: "cuda"                  # falls back to CPU automatically if unavailable
  checkpoint_dir: "checkpoints"


# ── HybridBathNet v3 hyper-parameters ────────────────────────────────────────
hybridbathnet:
  # ── Input channels ──────────────────────────────────────────────────────────
  # After §2.x feature engineering the patch tensor has this many channels:
  #   4 spectral (B02/B03/B04/B08) + 3 Lyzenga + 2 Lyzenga ratios
  #   + 1 Stumpf + 1 Beer-Lambert z_prior + 1 mask + 4 temporal std = 16
  #   + optional distance-to-shore (1 extra if use_distance_to_shore=true)
  in_channels: 16                 # update if use_distance_to_shore=true → 17
  n_spectral:  3                  # first 3 channels are B02/B03/B04 (raw reflectance)
  feature_dim: 128

  # ── §1.2 Physics: raw-reflectance Kd ────────────────────────────────────────
  # Mean/std de-normalisation buffers are loaded from the dataset at runtime;
  # no need to set them here.
  i0_over_epsilon: 100.0          # Beer-Lambert signal-to-noise threshold
  use_red_kd: true                # include B04 in QAA Kd formula (turbid-water gain)

  # ── §3.6 Reconstruction head ─────────────────────────────────────────────────
  use_recon_head: true            # enable self-supervised optical reconstruction loss
  n_recon_bands:  3               # reconstruct B02, B03, B04

  # ── Dropout / uncertainty ────────────────────────────────────────────────────
  dropout_rate: 0.1               # Dropout2d rate (keeps MC Dropout epistemic UQ)
  mc_samples:   30                # number of MC Dropout forward passes at test time

  # ── §4.1 One compensation mechanism ─────────────────────────────────────────
  use_depth_sampler:   true       # use DepthStratifiedSampler
  use_depth_weighting: false      # disable loss weighting when sampler is ON (§4.1)
  depth_strata: 5                 # number of depth quantile strata

  # ── §4.2 / §4.3 Loss ─────────────────────────────────────────────────────────
  loss_weights:
    w_mse:   1.0    # Huber (smooth_l1_loss) depth regression weight
    w_nll:   1.0    # β-NLL uncertainty calibration weight
    w_phys:  0.3    # non-negativity physical constraint (ReLU(-ŷ)) weight
    w_ext:   0.3    # Beer-Lambert extinction bound penalty weight
    w_recon: 0.1    # optical reconstruction self-supervised loss weight (§3.6)
    w_lowres: 0.5   # GEBCO-scale (46-pixel avg) consistency loss weight (§3.7)

  beta_nll:    0.5                # β-NLL exponent (0.5 recommended; 0 = standard NLL)
  huber_delta: 0.5                # smooth_l1_loss δ in normalised depth units

  # ── §4.5 Optimiser & schedule ────────────────────────────────────────────────
  # lr is set in training.learning_rate (2e-3 is recommended with 5-epoch warmup)
  nll_warmup_epochs: 20           # curriculum: NLL weight ramps from 0 → w_nll
  lr_restart_period: 30           # CosineAnnealingWarmRestarts T_0 (must divide epochs)
  grad_clip_norm: 1.0             # max gradient norm for clipping
  ema_decay: 0.999                # EMA weight decay for the shadow model
  early_stop_patience: 15         # epochs without val-RMSE improvement → stop

  # ── §3.8 Augmentation ─────────────────────────────────────────────────────────
  aug_noise_std: 0.02             # spectral jitter noise std (on z-scored channels)
  # use_rotations controlled by --no-rotations CLI flag (default: True)

  # ── §5.4 Calibration reporting ────────────────────────────────────────────────
  # Calibration metrics (NLL, coverage, sparsification) are always reported
  # for the test set. No extra config needed.

  # ── §5.2 Snapshot ensemble ────────────────────────────────────────────────────
  # Snapshots are saved automatically at the end of each cosine cycle.
  # Paths are logged and stored in the checkpoint dict under "snapshots".

  # ── §6.3 AMP / mixed precision ───────────────────────────────────────────────
  # Controlled by --no-amp CLI flag (AMP ON by default when CUDA is available).

evaluation:
  results_dir: "results"

export:
  output_dir: "outputs/rasters"
